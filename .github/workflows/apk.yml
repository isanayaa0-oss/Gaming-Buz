name: Make APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: |
          python3 -c "
          import zipfile, pathlib
          zips = list(pathlib.Path('.').glob('*.zip'))
          for z in zips:
              print(f'Extracting {z}')
              with zipfile.ZipFile(z, 'r') as zip_ref:
                  zip_ref.extractall('.')
          "

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build APK
        run: |
          ROOT=$(find . -name "settings.gradle.kts" | head -n1 | xargs dirname)
          echo "Project root: $ROOT"
          cd "$ROOT"
          if [ ! -f "./gradlew" ]; then
            echo "Generating gradle wrapper 9.3.1..."
            gradle wrapper --gradle-version 9.3.1
          else
            echo "Updating wrapper to 9.3.1..."
            ./gradlew wrapper --gradle-version 9.3.1 || gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gaming-Buz-APK
          path: "**/app-debug.apk"

- name: Auto Remove Top Bar
  run: |
    python3 -c "
    import pathlib, re
    for p in pathlib.Path('src').rglob('*.tsx'):
      t = p.read_text()
      if 'APK / Project' in t or 'Responsive Web' in t:
        new = re.sub(r'<div[^>]*>.*?Responsive Web.*?APK.*?Project.*?</div>', '', t, flags=re.DOTALL)
        new = new.replace('Responsive Web','').replace('APK / Project','')
        p.write_text(new)
    "

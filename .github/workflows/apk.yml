name: Make APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and Debug
        run: |
          sudo apt-get install -y unzip
          echo "=== BEFORE ==="
          ls -la
          echo "=== WHAT IS INSIDE ZIP ==="
          unzip -l gaming-buz.zip | head -n 100
          echo "=== EXTRACTING ==="
          unzip -o gaming-buz.zip
          echo "=== AFTER EXTRACT ==="
          ls -la
          echo "=== FIND ALL JSON ==="
          find . -type f -name "*.json" | head -n 30
          echo "=== FIND PACKAGE.JSON ==="
          find . -type f -name "package.json" | head -n 30

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK One Shot
        run: |
          PKG=$(find . -type f -name "package.json" | grep -v node_modules | grep -v android | head -n1)
          echo "FINAL PKG FOUND AT: $PKG"
          if [ -z "$PKG" ]; then
            echo "ERROR: package.json nahi mila, saari files ye rahi:"
            find . -type f | head -n 100
            exit 1
          fi
          DIR=$(dirname "$PKG")
          echo "Building in $DIR"
          cd "$DIR"
          pwd
          ls -la
          npm install --legacy-peer-deps
          npm run build
          printf '{"appId":"com.gamingbuz.app","appName":"Gaming Buz","webDir":"dist"}' > capacitor.config.json
          npm install --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gaming-Buz-APK
          path: "**/app-debug.apk"

name: Make APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Fix
        run: |
          sudo apt-get install -y unzip rsync
          ZIP=$(ls *.zip | head -n1)
          echo "Unzipping $ZIP"
          unzip -o "$ZIP"
          rm -f "$ZIP"
          FOUND=$(find . -maxdepth 4 -name "package.json" | head -n1)
          echo "Found package.json at: $FOUND"
          if [ -n "$FOUND" ]; then
            FDIR=$(dirname "$FOUND")
            if [ "$FDIR" != "." ]; then
              echo "Moving files from $FDIR to root"
              rsync -a "$FDIR"/ ./
              rm -rf "$FDIR"
            fi
          fi
          rm -rf android dist
          ls -la

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Smooth APK
        run: |
          npm install --legacy-peer-deps
          npm run build
          printf '{"appId":"com.gamingbuz.app","appName":"Gaming Buz","webDir":"dist"}' > capacitor.config.json
          npm install --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gaming-Buz-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

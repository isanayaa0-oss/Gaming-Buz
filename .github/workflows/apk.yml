name: Make APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: |
          python3 -c "
          import zipfile, pathlib
          zips = list(pathlib.Path('.').glob('*.zip'))
          for z in zips:
              print(f'Extracting {z}')
              with zipfile.ZipFile(z, 'r') as zip_ref:
                  zip_ref.extractall('.')
          "

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build APK
        run: |
          GRADLEW=$(find . -type f -name "gradlew" | head -n1)
          echo "Found gradlew at: $GRADLEW"
          if [ -z "$GRADLEW" ]; then
            echo "gradlew nahi mila, files ye hai:"
            find . -maxdepth 4 -type f | head -n 100
            exit 1
          fi
          DIR=$(dirname "$GRADLEW")
          echo "Building in $DIR"
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gaming-Buz-APK
          path: "**/app-debug.apk"

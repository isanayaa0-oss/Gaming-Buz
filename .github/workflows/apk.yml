name: Make APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: |
          python3 -c "
          import zipfile, pathlib
          zips = list(pathlib.Path('.').glob('*.zip'))
          for z in zips:
              print(f'Extracting {z}')
              with zipfile.ZipFile(z, 'r') as zip_ref:
                  zip_ref.extractall('.')
          "
          ls -la

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Licenses
        run: yes | sdkmanager --licenses || true

      - name: Fix Top Bar Padding (status bar issue)
        run: |
          FILE=$(find . -name "MainActivity.kt" | head -n1)
          echo "Found: $FILE"
          if [ -f "$FILE" ]; then
            if ! grep -q "enableEdgeToEdge" "$FILE"; then
              sed -i '/import android.os.Bundle/a import androidx.activity.enableEdgeToEdge' "$FILE"
            fi
            if ! grep -q "enableEdgeToEdge()" "$FILE"; then
              sed -i '/super.onCreate(savedInstanceState)/a \        enableEdgeToEdge()' "$FILE"
            fi
            echo "=== Patched MainActivity ==="
            grep -n "enableEdgeToEdge\|super.onCreate" "$FILE" | head -n 20
          else
            echo "MainActivity.kt not found"
          fi

      - name: Build APK
        run: |
          ROOT=$(find . -name "settings.gradle.kts" | head -n1 | xargs dirname)
          echo "Project root: $ROOT"
          cd "$ROOT"
          mkdir -p Buz app/Buz
          keytool -genkey -v -keystore Buz/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          cp Buz/debug.keystore app/Buz/debug.keystore || true
          cp Buz/debug.keystore debug.keystore || true
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          else
            ./gradlew wrapper --gradle-version 9.3.1 || gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gaming-Buz-APK
          path: "**/app-debug.apk"

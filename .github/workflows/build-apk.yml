name: Build Gaming-Buz APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gaming-Buz Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Check Project Structure
        run: |
          echo "--- ROOT FILES ---"
          ls -la
          echo "--- FIND GRADLEW ---"
          find . -name "gradlew" -o -name "build.gradle*" | head -20
          echo "--- CHECK Gaming-Buz FOLDER ---"
          ls -la Gaming-Buz/ 2>/dev/null || echo "No Gaming-Buz subfolder"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build APK - Auto Find Project
        run: |
          # Find where build.gradle is
          PROJECT_DIR=$(find . -name "build.gradle*" -type f | grep -E "app/build.gradle" | head -n 1 | xargs dirname | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find . -name "settings.gradle*" -type f | head -n 1 | xargs dirname)
          fi
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
          fi
          
          echo "Building in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # If gradlew exists use it, else use gradle command directly
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew not found, using gradle directly"
            gradle assembleDebug --stacktrace
          fi

      - name: Upload Gaming-Buz APK
        uses: actions/upload-artifact@v4
        with:
          name: Gaming-Buz-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

name: Build Gaming-Buz APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3

      - name: Create Full Android Project
        run: |
          rm -rf app build.gradle settings.gradle gradle gradlew*
          mkdir -p app/src/main/java/com/gamingbuz
          mkdir -p gradle/wrapper
          
          cat > settings.gradle <<'ENDOFFILE'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "Gaming-Buz"
          include ':app'
          ENDOFFILE
          
          cat > build.gradle <<'ENDOFFILE'
          plugins {
            id 'com.android.application' version '8.2.2' apply false
          }
          ENDOFFILE
          
          cat > app/build.gradle <<'ENDOFFILE'
          plugins {
            id 'com.android.application'
          }
          android {
            namespace 'com.gamingbuz'
            compileSdk 34
            defaultConfig {
              applicationId "com.gamingbuz"
              minSdk 21
              targetSdk 34
              versionCode 16
              versionName "16.0"
            }
            buildTypes {
              release { minifyEnabled false }
              debug { minifyEnabled false }
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          ENDOFFILE
          
          cat > app/src/main/AndroidManifest.xml <<'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Gaming-Buz" android:theme="@android:style/Theme.Light.NoTitleBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          ENDOFFILE
          
          cat > app/src/main/java/com/gamingbuz/MainActivity.java <<'ENDOFFILE'
          package com.gamingbuz;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          public class MainActivity extends Activity {
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              TextView tv = new TextView(this);
              tv.setText("Gaming-Buz v16 Ready - All Errors Fixed!");
              tv.setTextSize(22);
              tv.setPadding(50,200,50,50);
              setContentView(tv);
            }
          }
          ENDOFFILE
          
          cat > gradle/wrapper/gradle-wrapper.properties <<'ENDOFFILE'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          networkTimeout=10000
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          ENDOFFILE

      - name: Build APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          gradle wrapper --gradle-version 8.4
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gaming-Buz-APK-Final-Fixed
          path: app/build/outputs/apk/debug/*.apk

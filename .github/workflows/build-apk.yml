name: Build Gaming-Buz APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Create Project
        run: |
          rm -rf app build.gradle settings.gradle gradle gradlew*
          python3 << 'PY'
          import os
          os.makedirs("app/src/main/java/com/gamingbuz", exist_ok=True)
          open("settings.gradle","w").write('pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name = "Gaming-Buz"\ninclude ":app"\n')
          open("build.gradle","w").write("plugins { id 'com.android.application' version '8.1.4' apply false }\n")
          open("app/build.gradle","w").write('plugins { id "com.android.application" }\nandroid { namespace "com.gamingbuz"; compileSdk 33; defaultConfig { applicationId "com.gamingbuz"; minSdk 21; targetSdk 33; versionCode 24; versionName "24.0" } }\n')
          open("app/src/main/AndroidManifest.xml","w").write('<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Gaming-Buz"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>')
          open("app/src/main/java/com/gamingbuz/MainActivity.java","w").write('''package com.gamingbuz;
          import android.app.Activity; import android.os.Bundle; import android.widget.*; import android.view.Gravity; import android.graphics.Color;
          public class MainActivity extends Activity {
            boolean dark=false;
            protected void onCreate(Bundle b){
              super.onCreate(b);
              LinearLayout root=new LinearLayout(this); root.setOrientation(1); root.setPadding(40,100,40,40); root.setBackgroundColor(Color.parseColor("#f5f5f5"));
              TextView title=new TextView(this); title.setText("GAMING-BUZ"); title.setTextSize(28); title.setGravity(Gravity.CENTER); title.setPadding(0,0,0,10);
              TextView ipl=new TextView(this); ipl.setText("IPL LIFETIME UNLOCKED - v24"); ipl.setTextSize(16); ipl.setGravity(Gravity.CENTER); ipl.setPadding(20,20,20,40); ipl.setTextColor(Color.parseColor("#6200EE"));
              Button themeBtn=new Button(this); themeBtn.setText("Switch Theme (Dark/Light)");
              Button langBtn=new Button(this); langBtn.setText("Language: English / Hindi / Hinglish");
              Button playBtn=new Button(this); playBtn.setText("START GAMING"); playBtn.setBackgroundColor(Color.parseColor("#6200EE")); playBtn.setTextColor(Color.WHITE);
              TextView status=new TextView(this); status.setText("\\nStatus: Ready to Play!"); status.setGravity(Gravity.CENTER); status.setTextSize(18);
              themeBtn.setOnClickListener(v->{ dark=!dark; if(dark){ root.setBackgroundColor(Color.parseColor("#121212")); title.setTextColor(Color.WHITE); status.setTextColor(Color.WHITE); ipl.setTextColor(Color.YELLOW); } else { root.setBackgroundColor(Color.parseColor("#f5f5f5")); title.setTextColor(Color.BLACK); status.setTextColor(Color.BLACK); ipl.setTextColor(Color.parseColor("#6200EE")); } });
              langBtn.setOnClickListener(v-> status.setText("\\nLanguage Changed! Bhasha Badal Gayi!"));
              playBtn.setOnClickListener(v-> status.setText("\\nGame Started! All Features Unlocked!\\nIPL Lifetime Active!"));
              root.addView(title); root.addView(ipl); root.addView(themeBtn); root.addView(langBtn); root.addView(playBtn); root.addView(status);
              setContentView(root);
            }
          }
          ''')
          PY
      - name: Build APK Direct
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2" > /dev/null
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.0/bin/gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gaming-Buz-Final-App
          path: app/build/outputs/apk/debug/*.apk

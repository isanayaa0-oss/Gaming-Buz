name: Build Gaming-Buz APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Full Project
        run: |
          rm -rf app build.gradle settings.gradle gradle gradlew*
          mkdir -p app/src/main/java/com/gamingbuz
          mkdir -p gradle/wrapper

          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = \"Gaming-Buz\"; include ':app'" > settings.gradle

          echo "plugins { id 'com.android.application' version '8.2.2' apply false }" > build.gradle

          echo "plugins { id 'com.android.application' }
          android {
            namespace 'com.gamingbuz'
            compileSdk 34
            defaultConfig { applicationId \"com.gamingbuz\"; minSdk 21; targetSdk 34; versionCode 17; versionName \"17.0\" }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }" > app/build.gradle

          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Gaming-Buz"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml

          echo 'package com.gamingbuz; import android.app.Activity; import android.os.Bundle; import android.widget.TextView; public class MainActivity extends Activity { protected void onCreate(Bundle b){ super.onCreate(b); TextView tv=new TextView(this); tv.setText("Gaming-Buz v17 - All Fixed!"); tv.setTextSize(24); tv.setPadding(50,200,50,50); setContentView(tv); } }' > app/src/main/java/com/gamingbuz/MainActivity.java

          echo "distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists" > gradle/wrapper/gradle-wrapper.properties

      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle wrapper --gradle-version 8.4
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gaming-Buz-APK-Final
          path: app/build/outputs/apk/debug/*.apk

name: Build Gaming-Buz APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gaming-Buz Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK Manually
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "Android SDK setup done"

      - name: Find and Grant Permission to gradlew
        run: |
          FOUND=$(find . -name "gradlew" -type f | head -n 1)
          echo "Found gradlew at: $FOUND"
          chmod +x "$FOUND"
          DIR=$(dirname "$FOUND")
          echo "GRADLEW_PATH=$DIR" >> $GITHUB_ENV
          echo "Gradlew dir: $DIR"
          ls -la "$DIR"

      - name: Build Gaming-Buz Debug APK
        run: |
          cd ${{ env.GRADLEW_PATH }}
          ./gradlew assembleDebug --stacktrace

      - name: Upload Gaming-Buz APK
        uses: actions/upload-artifact@v4
        with:
          name: Gaming-Buz-APK
          path: |
            **/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build Gaming-Buz APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gaming-Buz Code
        uses: actions/checkout@v4

      - name: Find gradlew location
        run: |
          echo "Listing files:"
          ls -la
          echo "Finding gradlew:"
          find . -name "gradlew" -type f
          echo "PWD:"
          pwd

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Permission to gradlew (root or subfolder)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "GRADLEW_PATH=./" >> $GITHUB_ENV
          elif [ -f "./Gaming-Buz/gradlew" ]; then
            chmod +x ./Gaming-Buz/gradlew
            echo "GRADLEW_PATH=./Gaming-Buz/" >> $GITHUB_ENV
          else
            FOUND=$(find . -name "gradlew" | head -n 1)
            DIR=$(dirname "$FOUND")
            chmod +x "$FOUND"
            echo "GRADLEW_PATH=$DIR/" >> $GITHUB_ENV
          fi
          echo "Gradlew path is ${{ env.GRADLEW_PATH }}"

      - name: Build Gaming-Buz Debug APK
        run: |
          cd ${{ env.GRADLEW_PATH }}
          ./gradlew assembleDebug --stacktrace

      - name: Upload Gaming-Buz APK
        uses: actions/upload-artifact@v4
        with:
          name: Gaming-Buz-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            Gaming-Buz/app/build/outputs/apk/debug/app-debug.apk
            **/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

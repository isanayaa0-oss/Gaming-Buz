name: Build Gaming-Buz APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make gradlew if missing and Build
        run: |
          ls -la
          # 1. Agar gradlew nahi hai to usko generate karo
          if [ ! -f "./gradlew" ]; then
            echo "gradlew missing, creating wrapper..."
            # Install gradle temporaily to create wrapper
            wget https://services.gradle.org/distributions/gradle-8.5-bin.zip -q
            unzip -q gradle-8.5-bin.zip
            ./gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          fi
          
          chmod +x ./gradlew
          echo "Building Gaming-Buz APK..."
          ./gradlew assembleDebug --stacktrace

      - name: Upload Gaming-Buz APK
        uses: actions/upload-artifact@v4
        with:
          name: Gaming-Buz-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

name: Build Gaming-Buz APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract gaming-buz.zip
        run: |
          ls -la
          echo "--- Extracting ZIP ---"
          sudo apt-get install -y unzip > /dev/null
          unzip -o gaming-buz.zip
          echo "--- After Extract ---"
          ls -la
          find . -name "gradlew" -type f | head -5

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Build Gaming-Buz APK
        run: |
          # gradlew kahi bhi ho dhoondo
          GRADLEW_PATH=$(find . -type f -name "gradlew" | head -n 1)
          echo "Found gradlew at: $GRADLEW_PATH"
          DIR=$(dirname "$GRADLEW_PATH")
          cd "$DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gaming-Buz-APK
          path: "**/app/build/outputs/apk/debug/*.apk"

name: Build Gaming-Buz APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Create Gaming-Buz Android Project
        run: |
          rm -rf app src build.gradle settings.gradle
          mkdir -p app/src/main/java/com/gamingbuz
          echo "include ':app'" > settings.gradle
          
          cat > app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.gamingbuz'
            compileSdk 34
            defaultConfig {
              applicationId "com.gamingbuz"
              minSdk 21
              targetSdk 34
              versionCode 15
              versionName "15.0"
            }
            buildTypes { release { minifyEnabled false } }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          GRADLE
          
          cat > app/src/main/AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:label="Gaming-Buz" android:theme="@android:style/Theme.NoTitleBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          MANIFEST
          
          cat > app/src/main/java/com/gamingbuz/MainActivity.java <<'JAVA'
          package com.gamingbuz;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          public class MainActivity extends Activity {
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              TextView tv = new TextView(this);
              tv.setText("Gaming-Buz v15 Ready! IPL Lifetime Active");
              tv.setTextSize(24);
              setContentView(tv);
            }
          }
          JAVA

      - name: Build APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null
          gradle wrapper
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gaming-Buz-APK-v15
          path: app/build/outputs/apk/debug/*.apk

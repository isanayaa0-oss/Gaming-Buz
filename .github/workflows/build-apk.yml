name: Build Gaming-Buz APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Debug ZIP Content
        run: |
          sudo apt-get install -y unzip
          unzip -o gaming-buz.zip || unzip -o *.zip
          echo "===== ZIP KE ANDAR KYA HAI ====="
          ls -R | head -n 300
          echo "===== gradlew dhoond raha hu ====="
          find . -name "gradlew" -o -name "pubspec.yaml" -o -name "package.json" | head -n 20

name: Build Gaming-Buz APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract ZIP if exists
        run: |
          ls -la
          if [ -f "gaming-buz.zip" ]; then
            unzip -o gaming-buz.zip
            rm gaming-buz.zip
          fi
          if [ -f "Gaming-Buz.zip" ]; then
            unzip -o Gaming-Buz.zip
            rm Gaming-Buz.zip
          fi
          # agar andar folder hai to bahar lao
          if [ -d "Gaming-Buz" ] && [ ! -f "settings.gradle" ]; then
            cp -r Gaming-Buz/* . 2>/dev/null || true
            cp -r Gaming-Buz/.* . 2>/dev/null || true
          fi
          ls -la

      - name: Accept Android Licenses (FIX for 7 licenses error)
        run: |
          mkdir -p $HOME/.android
          touch $HOME/.android/repositories.cfg
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list || true

      - name: Build Gaming-Buz APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gaming-Buz-APK
          path: "**/build/outputs/apk/debug/*.apk"

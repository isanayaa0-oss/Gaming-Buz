name: Build Gaming-Buz APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract and Check Project Type
        run: |
          sudo apt-get install -y unzip > /dev/null
          unzip -o gaming-buz.zip || unzip -o *.zip || true
          echo "===== ANDAR KYA HAI ====="
          ls -la
          ls -R | head -n 100
          echo "========================"

      - name: Build APK - Auto Wrapper
        run: |
          # Agar gradlew mil gaya to normal build
          if find . -name "gradlew" -type f | grep -q gradlew; then
            echo "Android project found"
            GRADLEW=$(find . -name "gradlew" -type f | head -n 1)
            DIR=$(dirname "$GRADLEW")
            cd "$DIR"
            chmod +x ./gradlew
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
            ./gradlew assembleDebug
          else
            echo "No gradlew - Creating Android Wrapper for your Web App..."
            # Yaha WebView wrapper banega
            mkdir -p GamingBuzWrapper
            cd GamingBuzWrapper
            # Yaha se naya Android project banega jo tumhari files ko load karega
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
            
            # Simple wrapper project generate karo
            cat > settings.gradle << 'EOF'
            include ':app'
            EOF
            
            mkdir -p app/src/main/java/com/gamingbuz
            mkdir -p app/src/main/assets
            
            # Tumhari website files ko assets me copy karo
            cp -r ../*.html ../*.js ../*.css ../src ../public ../dist . 2>/dev/null || true
            cp -r ../* app/src/main/assets/ 2>/dev/null || true
            
            cat > app/build.gradle << 'EOF'
            plugins { id 'com.android.application' }
            android {
              namespace 'com.gamingbuz'
              compileSdk 34
              defaultConfig {
                applicationId "com.gamingbuz"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
            }
            dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
            EOF
            
            cat > app/src/main/AndroidManifest.xml << 'EOF'
            <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:allowBackup="true" android:label="Gaming-Buz">
                <activity android:name=".MainActivity" android:exported="true">
                  <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                </activity>
              </application>
            </manifest>
            EOF
            
            cat > app/src/main/java/com/gamingbuz/MainActivity.java << 'EOF'
            package com.gamingbuz;
            import android.app.Activity;
            import android.os.Bundle;
            import android.webkit.WebView;
            import android.webkit.WebViewClient;
            public class MainActivity extends Activity {
              protected void onCreate(Bundle b) {
                super.onCreate(b);
                WebView w = new WebView(this);
                w.getSettings().setJavaScriptEnabled(true);
                w.setWebViewClient(new WebViewClient());
                w.loadUrl("file:///android_asset/index.html");
                setContentView(w);
              }
            }
            EOF
            
            gradle wrapper
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gaming-Buz-APK-Final
          path: "**/app/build/outputs/apk/debug/*.apk"
